services:
  - type: web
    name: trading-analysis-mcp
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r mcp_server/requirements.txt
    startCommand: uvicorn mcp_server.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_MIN_CONFIDENCE
        value: "75"
      - key: GEMINI_API_KEY
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: MT5_API_SECRET
        sync: false
